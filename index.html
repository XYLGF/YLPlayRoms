<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>YL Play Roms</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
      background: #ffffff;
      color: #111111;
      font-weight: 300;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .navbar {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 56px;
      background: #ffffff;
      border-bottom: 2px solid #111111;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 999;
    }
    .nav-logo { font-size: 18px; font-weight: 600; letter-spacing: 1px; }
    .nav-avatar {
      width: 34px; height: 34px;
      border: 2px solid #111111;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 600;
      cursor: pointer;
      background: transparent;
      text-transform: uppercase;
    }

    .page { display: none; padding-top: 56px; min-height: 100vh; }
    .page.active { display: block; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      border: 2px solid #111111; background: transparent; color: #111111;
      font-size: 15px; font-weight: 500; padding: 10px 24px;
      border-radius: 4px; cursor: pointer; transition: all 0.15s;
      letter-spacing: 1px; font-family: inherit;
    }
    .btn:active { background: #111111; color: #ffffff; }
    .btn-block { width: 100%; display: flex; }
    .btn-sm { padding: 6px 16px; font-size: 14px; }

    .market-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px;
    }
    .market-header h1 { font-size: 28px; font-weight: 700; }

    .search-bar {
      display: flex; align-items: center;
      margin: 0 20px 20px;
      border: 2px solid #111111; border-radius: 4px;
      padding: 10px 14px; gap: 10px;
    }
    .search-bar input {
      flex: 1; border: none; outline: none;
      font-size: 15px; font-family: inherit;
      background: transparent; color: #111111;
    }
    .search-bar input::placeholder { color: #999; }

    .market-list {
      padding: 0 20px 40px;
      display: flex; flex-direction: column; gap: 20px;
    }

    .rom-card {
      border: 2px solid #111111; border-radius: 4px;
      padding: 16px; cursor: pointer;
      transition: transform 0.1s;
    }
    .rom-card:active { transform: scale(0.99); }

    .rom-logo-placeholder {
      height: 160px;
      border: 2px solid #111111;
      margin-bottom: 14px;
      display: flex; align-items: center; justify-content: center;
      background: #f7f7f7;
      overflow: hidden;
    }
    .rom-logo-placeholder svg { width: 80px; height: 80px; }
    .rom-logo-placeholder img { width: 100%; height: 100%; object-fit: contain; }

    .rom-bottom { display: flex; align-items: flex-end; justify-content: space-between; }
    .rom-bottom h3 { font-size: 22px; font-weight: 700; }
    .rom-bottom p { font-size: 15px; color: #555; margin-top: 2px; }

    .empty-tip {
      text-align: center; color: #999; padding: 80px 20px;
      font-size: 15px; line-height: 1.8;
    }

    .detail-logo {
      height: 220px;
      display: flex; align-items: center; justify-content: center;
      border-bottom: 2px solid #111111;
      background: #f7f7f7;
      overflow: hidden;
    }
    .detail-logo svg { width: 120px; height: 120px; }
    .detail-logo img { width: 100%; height: 100%; object-fit: contain; }

    .detail-info {
      display: flex; justify-content: space-between;
      padding: 20px; border-bottom: 2px solid #111111;
    }
    .detail-left h3 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
    .detail-left p { font-size: 16px; color: #333; line-height: 1.6; }
    .detail-left .btn { margin-top: 12px; }
    .detail-left .btn-row { display: flex; gap: 10px; }
    .detail-right { text-align: right; font-size: 14px; line-height: 1.9; color: #111111; }

    .comment-section { padding: 20px; }
    .comment-section h2 { font-size: 24px; font-weight: 700; margin-bottom: 20px; }

    .comment-item { display: flex; gap: 12px; margin-bottom: 20px; }
    .comment-avatar {
      width: 44px; height: 44px;
      border: 2px solid #111111; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 600; flex-shrink: 0;
      text-transform: uppercase;
    }
    .comment-body { flex: 1; }
    .comment-meta { font-size: 14px; font-weight: 500; margin-bottom: 8px; }
    .comment-content {
      border: 2px solid #111111; border-radius: 4px;
      padding: 12px 14px; font-size: 15px;
    }

    .comment-input-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 20px; border-top: 2px solid #111111;
      background: #fff; position: sticky; bottom: 0;
    }
    .comment-input-bar input {
      flex: 1; border: 2px solid #111111; border-radius: 4px;
      padding: 10px 14px; font-size: 15px; font-family: inherit;
      outline: none; background: transparent;
    }
    .comment-send {
      width: 40px; height: 40px;
      border: 2px solid #111111; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
    }
    .comment-send svg { width: 18px; height: 18px; }

    .auth-container { padding: 60px 24px; }
    .auth-title { font-size: 32px; font-weight: 700; margin-bottom: 32px; }
    .auth-box { border: 2px solid #111111; border-radius: 4px; padding: 28px 22px; }
    .auth-field { display: flex; align-items: center; margin-bottom: 20px; gap: 14px; }
    .auth-field label { font-size: 18px; font-weight: 600; width: 80px; text-align: right; flex-shrink: 0; }
    .auth-field input {
      flex: 1; border: 2px solid #111111; border-radius: 4px;
      padding: 10px 12px; font-size: 15px; font-family: inherit;
      outline: none; background: transparent;
    }
    .auth-field .optional { font-size: 13px; font-weight: 400; color: #666; width: 80px; text-align: right; flex-shrink: 0; }
    .auth-btn-row { display: flex; gap: 12px; margin-top: 20px; }
    .auth-btn-row .btn { flex: 1; }

    .profile-header {
      display: flex; flex-direction: column; align-items: center;
      padding: 40px 20px 28px; border-bottom: 2px solid #111111;
    }
    .profile-avatar {
      width: 110px; height: 110px;
      border: 3px solid #111111; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 44px; font-weight: 700; margin-bottom: 18px;
      text-transform: uppercase;
    }
    .profile-name { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    .profile-level { font-size: 18px; font-weight: 300; color: #555; }

    .tabs { display: flex; border-bottom: 2px solid #111111; }
    .tab {
      flex: 1; text-align: center; padding: 16px;
      font-size: 17px; font-weight: 600; cursor: pointer;
      color: #999;
    }
    .tab.active { color: #111111; border-bottom: 4px solid #111111; margin-bottom: -2px; }

    .tab-content { display: none; padding: 20px; }
    .tab-content.active { display: block; }

    .publish-container { padding: 24px; }
    .publish-title { font-size: 28px; font-weight: 700; margin-bottom: 24px; }
    .publish-field { display: flex; align-items: center; margin-bottom: 16px; gap: 14px; }
    .publish-field label { font-size: 17px; font-weight: 600; width: 90px; text-align: right; flex-shrink: 0; }
    .publish-field input {
      flex: 1; border: 2px solid #111111; border-radius: 4px;
      padding: 10px 12px; font-size: 15px; font-family: inherit;
      outline: none; background: transparent;
    }
    .publish-box { border: 2px solid #111111; border-radius: 4px; padding: 18px; margin-top: 20px; }
    .publish-options { display: flex; gap: 14px; margin-bottom: 14px; }
    .publish-option {
      flex: 1; border: 2px solid #111111; border-radius: 4px;
      padding: 12px; text-align: center; font-size: 18px; font-weight: 600;
      cursor: pointer;
    }
    .publish-option.selected { background: #111111; color: #ffffff; }
    .publish-hint { font-size: 13px; color: #555; margin-bottom: 10px; }
    .publish-code-input {
      width: 100%; border: 2px solid #111111; border-radius: 4px;
      padding: 10px 12px; font-size: 15px; font-family: inherit;
      outline: none; background: transparent;
    }
    .publish-container .btn-block { margin-top: 24px; }

    .toast {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #111111; color: #fff;
      font-size: 15px; padding: 14px 32px;
      border-radius: 6px; z-index: 9999;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
    }
    .toast.show { opacity: 1; }

    .back-bar {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 20px; border-bottom: 2px solid #111111;
    }
    .back-btn {
      font-size: 22px; cursor: pointer;
      font-weight: 600; line-height: 1;
      background: transparent; border: none;
    }
    .back-title { font-size: 17px; font-weight: 600; }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="nav-logo">YL Play Roms</div>
    <div class="nav-avatar" id="navAvatar" onclick="onAvatarClick()">?</div>
  </header>

  <div class="page active" id="pageMarket">
    <div class="market-header">
      <h1>Rom市场</h1>
      <button class="btn" onclick="onPublishClick()">发布rom</button>
    </div>
    <div class="search-bar">
      <input type="text" placeholder="搜索你的系统" id="searchInput" oninput="filterMarket()">
      <svg viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </div>
    <div class="market-list" id="marketList"></div>
  </div>

  <div class="page" id="pageDetail">
    <div class="back-bar">
      <button class="back-btn" onclick="goMarket()">←</button>
      <div class="back-title">系统详情</div>
    </div>
    <div class="detail-logo" id="detailLogo"></div>
    <div class="detail-info">
      <div class="detail-left">
        <h3 id="detailName">-</h3>
        <p id="detailVersion">-</p>
        <p id="detailDeveloper">-</p>
        <div class="btn-row" style="margin-top:12px;">
          <button class="btn" id="detailDownloadBtn" onclick="onDownloadClick()">下载</button>
          <button class="btn" id="detailFavBtn" onclick="onFavoriteClick()">收藏</button>
        </div>
      </div>
      <div class="detail-right">
        <div>下载人数:<span id="detailDownloads">0</span></div>
        <div>浏览人数:<span id="detailViews">0</span></div>
        <div>收藏人数:<span id="detailFavs">0</span></div>
      </div>
    </div>
    <div class="comment-section">
      <h2>评论区</h2>
      <div id="commentList"></div>
    </div>
    <div class="comment-input-bar">
      <input type="text" placeholder="发布评论吧!" id="commentInput">
      <div class="comment-send" onclick="sendComment()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </div>
    </div>
  </div>

  <div class="page" id="pageAuth">
    <div class="auth-container">
      <div class="auth-title">注册@登录</div>
      <div class="auth-box">
        <div class="auth-field"><label>用户名</label><input type="text" id="authUsername" autocomplete="username"></div>
        <div class="auth-field"><label>密码</label><input type="password" id="authPassword" autocomplete="current-password"></div>
        <div class="auth-field"><span class="optional">邮箱(非必填)</span><input type="email" id="authEmail"></div>
        <div class="auth-btn-row">
          <button class="btn" onclick="handleLogin()">登录</button>
          <button class="btn" onclick="handleRegister()">注册</button>
        </div>
      </div>
    </div>
  </div>

  <div class="page" id="pageProfile">
    <div class="profile-header">
      <div class="profile-avatar" id="profileAvatar">?</div>
      <div class="profile-name" id="profileName">-</div>
      <div class="profile-level" id="profileLevel">Lv.0</div>
    </div>
    <div class="tabs">
      <div class="tab active" onclick="switchTab('published')">我发布的</div>
      <div class="tab" onclick="switchTab('favorites')">我的收藏</div>
    </div>
    <div class="tab-content active" id="tabPublished">
      <div id="myRomList"></div>
    </div>
    <div class="tab-content" id="tabFavorites">
      <div id="myFavList"></div>
    </div>
    <div style="padding: 20px;">
      <button class="btn btn-block" onclick="handleLogout()">退出登录</button>
    </div>
  </div>

  <div class="page" id="pagePublish">
    <div class="publish-container">
      <div class="publish-title">发布Roms</div>
      <div class="publish-field"><label>名称</label><input type="text" id="pubName"></div>
      <div class="publish-field"><label>版本</label><input type="text" id="pubVersion"></div>
      <div class="publish-field"><label>开发者</label><input type="text" id="pubDeveloper"></div>
      <div class="publish-field"><label>下载地址</label><input type="text" id="pubUrl" placeholder="例如 example.com/rom.zip"></div>

      <!-- LOGO 上传 -->
      <div class="publish-field">
        <label>LOGO</label>
        <div style="flex:1;">
          <input type="file" id="pubLogo" accept="image/*" onchange="onLogoSelected(event)" style="display:none;">
          <button type="button" class="btn" onclick="document.getElementById('pubLogo').click()">选择图片</button>
          <span id="logoStatus" style="margin-left:10px;font-size:14px;color:#666;">未选择（可选）</span>
          <div id="logoPreview" style="margin-top:10px;"></div>
        </div>
      </div>

      <div class="publish-field"><label>下载条件</label></div>
      <div class="publish-box">
        <div class="publish-options">
          <div class="publish-option selected" id="optFree" onclick="selectPublishOption('free')">免费</div>
          <div class="publish-option" id="optCode" onclick="selectPublishOption('code')">需要激活码</div>
        </div>
        <div class="publish-hint">激活码(如果选的是免费就不需要填)</div>
        <input type="text" class="publish-code-input" id="pubCode" disabled>
      </div>
      <button class="btn btn-block" onclick="handlePublish()">上传</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API_BASE = 'https://roms.xylplay.top';

    let currentUser = null;
    let currentRom = null;
    let currentTab = 'published';
    let marketData = [];
    let publishCondition = 'free';
    let currentLogoData = '';

    function normalizeUrl(url) {
      if (!url) return '';
      url = String(url).trim();
      if (/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(url)) return url;
      return 'https://' + url;
    }

    function saveUser() {
      if (currentUser) localStorage.setItem('yl_user', JSON.stringify(currentUser));
      else localStorage.removeItem('yl_user');
    }
    function loadUser() {
      const s = localStorage.getItem('yl_user');
      if (s) { try { currentUser = JSON.parse(s); } catch (e) { currentUser = null; } }
    }

    const pages = {
      pageMarket: 'Rom市场',
      pageDetail: '系统详情',
      pageAuth: '注册@登录',
      pageProfile: '个人中心',
      pagePublish: '发布系统'
    };

    function switchPage(id) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      const t = document.getElementById(id);
      if (t) { t.classList.add('active'); window.scrollTo(0, 0); }
      document.querySelector('.nav-logo').textContent = 'YL Play Roms' + (pages[id] ? ' · ' + pages[id] : '');
      if (id === 'pageMarket') loadMarket();
      if (id === 'pageProfile' && currentUser) loadProfile();
    }

    function forceGoMarket() {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('pageMarket').classList.add('active');
      window.scrollTo(0, 0);
      document.querySelector('.nav-logo').textContent = 'YL Play Roms · Rom市场';
      loadMarket();
    }

    function goMarket() {
      history.pushState({}, '', '/');
      forceGoMarket();
    }

    function onAvatarClick() {
      if (currentUser) switchPage('pageProfile');
      else switchPage('pageAuth');
    }
    function onPublishClick() {
      if (!currentUser) { showToast('请先登录'); switchPage('pageAuth'); return; }
      switchPage('pagePublish');
    }

    let toastTimer = null;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s == null ? '' : s;
      return d.innerHTML;
    }
    function updateAvatarUI() {
      const av = document.getElementById('navAvatar');
      av.textContent = currentUser ? currentUser.username.charAt(0).toUpperCase() : '?';
    }

    const BOOK_SVG = `
      <svg viewBox="0 0 64 64" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 12 Q8 8 12 8 L32 8 L32 56 L12 56 Q8 56 8 52 Z"/>
        <path d="M32 8 L52 8 Q56 8 56 12 L56 52 Q56 56 52 56 L32 56"/>
        <line x1="16" y1="20" x2="26" y2="20"/>
        <line x1="16" y1="28" x2="26" y2="28"/>
        <line x1="16" y1="36" x2="26" y2="36"/>
      </svg>
    `;

    function renderLogo(rom) {
      if (rom && rom.logo) {
        return `<img src="${rom.logo}" alt="">`;
      }
      return BOOK_SVG;
    }

    // ============================================================
    // LOGO 选择 + 自动压缩（5MB 上限，压缩到 400px，JPEG 75%）
    // ============================================================
    function onLogoSelected(event) {
      const file = event.target.files[0];
      if (!file) return;

      // 放宽到 5MB
      if (file.size > 5 * 1024 * 1024) {
        showToast('图片不能超过 5MB');
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          // 压缩：最长边缩到 400px
          const canvas = document.createElement('canvas');
          const maxSize = 400;
          let w = img.width, h = img.height;
          if (w > h) {
            if (w > maxSize) { h = h * maxSize / w; w = maxSize; }
          } else {
            if (h > maxSize) { w = w * maxSize / h; h = maxSize; }
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);

          // 转 JPEG 质量 0.75，体积更小
          currentLogoData = canvas.toDataURL('image/jpeg', 0.75);

          document.getElementById('logoStatus').textContent = '已选择 ✅';
          document.getElementById('logoPreview').innerHTML =
            `<img src="${currentLogoData}" style="max-width:100px;max-height:100px;border:2px solid #111;border-radius:4px;">`;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // ============================================================
    // 市场
    // ============================================================
    async function loadMarket() {
      const list = document.getElementById('marketList');
      try {
        const res = await fetch(API_BASE + '/api/roms');
        marketData = await res.json();
        renderMarket(marketData);
      } catch (e) {
        list.innerHTML = '<div class="empty-tip">加载失败，请稍后重试</div>';
      }
    }

    function renderMarket(data) {
      const list = document.getElementById('marketList');
      if (!data || data.length === 0) {
        list.innerHTML = '<div class="empty-tip">还没有任何系统<br>点击右上角「发布rom」上传第一个吧</div>';
        return;
      }
      list.innerHTML = data.map(rom => `
        <div class="rom-card" onclick="openDetailBySlug('${rom.slug}')">
          <div class="rom-logo-placeholder">${renderLogo(rom)}</div>
          <div class="rom-bottom">
            <div>
              <h3>${escapeHtml(rom.name)}</h3>
              <p>${escapeHtml(rom.developer || '未知开发者')}</p>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterMarket() {
      const kw = document.getElementById('searchInput').value.trim().toLowerCase();
      if (!kw) { renderMarket(marketData); return; }
      const filtered = marketData.filter(r =>
        (r.name || '').toLowerCase().includes(kw) ||
        (r.developer || '').toLowerCase().includes(kw)
      );
      renderMarket(filtered);
    }

    // ============================================================
    // 系统详情
    // ============================================================
    async function openDetailBySlug(slug, updateUrl = true) {
      try {
        const res = await fetch(API_BASE + '/api/rom/by-slug/' + slug);
        const rom = await res.json();
        if (!rom || rom.success === false) {
          showToast('系统不存在');
          history.pushState({}, '', '/');
          forceGoMarket();
          return;
        }
        currentRom = rom;

        document.getElementById('detailLogo').innerHTML = renderLogo(rom);
        document.getElementById('detailName').textContent = rom.name;
        document.getElementById('detailVersion').textContent = rom.version || '';
        document.getElementById('detailDeveloper').textContent = rom.developer || '';
        document.getElementById('detailDownloads').textContent = rom.downloads || 0;
        document.getElementById('detailViews').textContent = rom.views || 0;
        document.getElementById('detailFavs').textContent = rom.favorites_count || 0;

        if (currentUser) {
          try {
            const fRes = await fetch(API_BASE + '/api/favorite/check?username=' + encodeURIComponent(currentUser.username) + '&romId=' + rom.id);
            const fData = await fRes.json();
            document.getElementById('detailFavBtn').textContent = fData.favorited ? '已收藏' : '收藏';
          } catch (e) {
            document.getElementById('detailFavBtn').textContent = '收藏';
          }
        } else {
          document.getElementById('detailFavBtn').textContent = '收藏';
        }

        loadComments(rom.id);
        switchPage('pageDetail');

        if (updateUrl) {
          history.pushState({ slug }, '', '/system/' + slug);
        }
      } catch (e) {
        showToast('加载失败');
        history.pushState({}, '', '/');
        forceGoMarket();
      }
    }

    function onDownloadClick() {
      if (!currentRom) return;
      const romId = currentRom.id;
      const finalUrl = normalizeUrl(currentRom.url);
      if (!finalUrl) { showToast('下载地址无效'); return; }

      if (currentRom.condition === 'code') {
        const input = prompt('请输入激活码：');
        if (input === null) return;
        if (input !== currentRom.code) { showToast('激活码错误'); return; }
      }

      const a = document.createElement('a');
      a.href = finalUrl;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      fetch(API_BASE + '/api/rom/download', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ romId, username: currentUser ? currentUser.username : '' })
      }).catch(() => {});
    }

    async function onFavoriteClick() {
      if (!currentUser) { showToast('请先登录'); switchPage('pageAuth'); return; }
      if (!currentRom) return;
      try {
        const res = await fetch(API_BASE + '/api/favorite', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ romId: currentRom.id, username: currentUser.username })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('detailFavBtn').textContent = data.favorited ? '已收藏' : '收藏';
          showToast(data.favorited ? '已加入收藏' : '已取消收藏');
          const romRes = await fetch(API_BASE + '/api/rom/' + currentRom.id);
          const rom = await romRes.json();
          document.getElementById('detailFavs').textContent = rom.favorites_count || 0;
        }
      } catch (e) { showToast('操作失败'); }
    }

    // ============================================================
    // 评论
    // ============================================================
    async function loadComments(romId) {
      const list = document.getElementById('commentList');
      try {
        const res = await fetch(API_BASE + '/api/comments?romId=' + romId);
        const data = await res.json();
        if (!data || data.length === 0) {
          list.innerHTML = '<div style="color:#999;font-size:14px;padding:10px 0;">还没有评论，来抢沙发吧</div>';
          return;
        }
        list.innerHTML = data.map(c => `
          <div class="comment-item">
            <div class="comment-avatar">${escapeHtml((c.username || '?').charAt(0))}</div>
            <div class="comment-body">
              <div class="comment-meta">${escapeHtml(c.username)} · ${formatTime(c.created_at)}</div>
              <div class="comment-content">${escapeHtml(c.content)}</div>
            </div>
          </div>
        `).join('');
      } catch (e) {
        list.innerHTML = '<div style="color:#999;font-size:14px;">加载失败</div>';
      }
    }

    async function sendComment() {
      if (!currentUser) { showToast('请先登录'); switchPage('pageAuth'); return; }
      if (!currentRom) return;
      const input = document.getElementById('commentInput');
      const content = input.value.trim();
      if (!content) { showToast('请输入评论内容'); return; }
      try {
        await fetch(API_BASE + '/api/comments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ romId: currentRom.id, username: currentUser.username, content })
        });
        input.value = '';
        loadComments(currentRom.id);
        showToast('评论成功');
      } catch (e) { showToast('评论失败'); }
    }

    function formatTime(ts) {
      const d = new Date(ts);
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    // ============================================================
    // 登录 / 注册
    // ============================================================
    async function handleLogin() {
      const username = document.getElementById('authUsername').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      if (!username || !password) { showToast('请填写用户名和密码'); return; }
      try {
        const res = await fetch(API_BASE + '/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          currentUser = data.user;
          saveUser();
          updateAvatarUI();
          showToast('登录成功');
          switchPage('pageMarket');
        } else { showToast(data.message || '登录失败'); }
      } catch (e) { showToast('网络错误'); }
    }

    async function handleRegister() {
      const username = document.getElementById('authUsername').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      const email = document.getElementById('authEmail').value.trim();
      if (!username || !password) { showToast('请填写用户名和密码'); return; }
      try {
        const res = await fetch(API_BASE + '/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, email })
        });
        const data = await res.json();
        if (data.success) { showToast('注册成功，请登录'); }
        else { showToast(data.message || '注册失败'); }
      } catch (e) { showToast('网络错误'); }
    }

    // ============================================================
    // 个人中心
    // ============================================================
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', ['published', 'favorites'][i] === tab);
      });
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      if (tab === 'published') {
        document.getElementById('tabPublished').classList.add('active');
        loadMyRoms();
      } else if (tab === 'favorites') {
        document.getElementById('tabFavorites').classList.add('active');
        loadMyFavorites();
      }
    }

    function handleLogout() {
      currentUser = null;
      saveUser();
      updateAvatarUI();
      forceGoMarket();
      showToast('已退出登录');
    }

    async function loadProfile() {
      if (!currentUser) { switchPage('pageAuth'); return; }
      const name = currentUser.username;
      document.getElementById('profileName').textContent = name;
      document.getElementById('profileAvatar').textContent = name.charAt(0).toUpperCase();
      try {
        const res = await fetch(API_BASE + '/api/user/level?username=' + encodeURIComponent(name));
        const data = await res.json();
        if (data.success) {
          document.getElementById('profileLevel').textContent = 'Lv.' + data.level;
        }
      } catch (e) {}
      loadMyRoms();
    }

    async function loadMyRoms() {
      const list = document.getElementById('myRomList');
      if (!currentUser) return;
      try {
        const res = await fetch(API_BASE + '/api/roms/my?username=' + encodeURIComponent(currentUser.username));
        const data = await res.json();
        if (!data || data.length === 0) {
          list.innerHTML = '<div class="empty-tip">还没有发布过系统</div>';
          return;
        }
        list.innerHTML = data.map(rom => `
          <div class="rom-card" style="margin-bottom:16px;" onclick="openDetailBySlug('${rom.slug}')">
            <div class="rom-logo-placeholder">${renderLogo(rom)}</div>
            <div class="rom-bottom">
              <div>
                <h3>${escapeHtml(rom.name)}</h3>
                <p>${escapeHtml(rom.developer || '')}</p>
              </div>
            </div>
          </div>
        `).join('');
      } catch (e) { list.innerHTML = '<div class="empty-tip">加载失败</div>'; }
    }

    async function loadMyFavorites() {
      const list = document.getElementById('myFavList');
      if (!currentUser) return;
      try {
        const res = await fetch(API_BASE + '/api/favorites/my?username=' + encodeURIComponent(currentUser.username));
        const data = await res.json();
        if (!data || data.length === 0) {
          list.innerHTML = '<div class="empty-tip">还没有收藏任何系统</div>';
          return;
        }
        list.innerHTML = data.map(rom => `
          <div class="rom-card" style="margin-bottom:16px;" onclick="openDetailBySlug('${rom.slug}')">
            <div class="rom-logo-placeholder">${renderLogo(rom)}</div>
            <div class="rom-bottom">
              <div>
                <h3>${escapeHtml(rom.name)}</h3>
                <p>${escapeHtml(rom.developer || '')}</p>
              </div>
            </div>
          </div>
        `).join('');
      } catch (e) { list.innerHTML = '<div class="empty-tip">加载失败</div>'; }
    }

    // ============================================================
    // 发布
    // ============================================================
    function selectPublishOption(type) {
      publishCondition = type;
      document.getElementById('optFree').classList.toggle('selected', type === 'free');
      document.getElementById('optCode').classList.toggle('selected', type === 'code');
      document.getElementById('pubCode').disabled = (type === 'free');
    }

    async function handlePublish() {
      if (!currentUser) { showToast('请先登录'); switchPage('pageAuth'); return; }
      const name = document.getElementById('pubName').value.trim();
      const version = document.getElementById('pubVersion').value.trim();
      const developer = document.getElementById('pubDeveloper').value.trim();
      let url = document.getElementById('pubUrl').value.trim();
      const code = document.getElementById('pubCode').value.trim();

      if (!name || !version || !developer || !url) { showToast('请填写完整信息'); return; }
      url = normalizeUrl(url);

      try {
        const res = await fetch(API_BASE + '/api/roms', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name, version, developer, url, condition: publishCondition,
            code: publishCondition === 'code' ? code : '',
            author: currentUser.username,
            logo: currentLogoData
          })
        });
        const data = await res.json();
        if (data.success) {
          showToast('发布成功');
          document.getElementById('pubName').value = '';
          document.getElementById('pubVersion').value = '';
          document.getElementById('pubDeveloper').value = '';
          document.getElementById('pubUrl').value = '';
          document.getElementById('pubCode').value = '';
          currentLogoData = '';
          document.getElementById('logoStatus').textContent = '未选择（可选）';
          document.getElementById('logoPreview').innerHTML = '';
          switchPage('pageProfile');
        } else { showToast(data.message || '发布失败'); }
      } catch (e) { showToast('网络错误'); }
    }

    // ============================================================
    // 初始化 + 路由
    // ============================================================
    loadUser();
    updateAvatarUI();

    (function initRoute() {
      const path = window.location.pathname;
      const match = path.match(/^\/system\/(\d+)$/);
      if (match) {
        openDetailBySlug(match[1], false);
      } else {
        switchPage('pageMarket');
      }
    })();

    window.addEventListener('popstate', () => {
      const path = window.location.pathname;
      const match = path.match(/^\/system\/(\d+)$/);
      if (match) {
        openDetailBySlug(match[1], false);
      } else {
        forceGoMarket();
      }
    });
  </script>
</body>
</html>
